<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Sim</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #677085; --line: #dfe3ea;
    --idle: #8a94a8; --coast: #d99a1e; --brake: #d64545; --stopped: #7b2fbf;
    --applies: #d64545; --notours: #9aa3b5; --unknown: #e08a1e; --turn: #2a7de1; --accent: #2a7de1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --panel: #1b2029; --ink: #e6e9ef; --muted: #98a1b3; --line: #2c3340;
      --idle: #6f7a8f; --notours: #5d6678;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --panel: #1b2029; --ink: #e6e9ef; --muted: #98a1b3; --line: #2c3340;
    --idle: #6f7a8f; --notours: #5d6678;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  select, input, button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  #status { color: var(--muted); margin-left: auto; font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: calc(100vh - 54px); }
  #left { display: grid; grid-template-rows: minmax(0, 1fr) 190px 52px; min-width: 0; }
  #map { min-height: 200px; }
  #chart { width: 100%; height: 100%; display: block; background: var(--panel); border-top: 1px solid var(--line); cursor: crosshair; }
  #controls { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--line); }
  #scrub { flex: 1; }
  #now { min-width: 210px; font-variant-numeric: tabular-nums; color: var(--muted); }
  aside { overflow: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 12px; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-variant-numeric: tabular-nums; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  #events { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  #events li { padding: 4px 6px; border-radius: 4px; cursor: pointer; display: flex; gap: 8px; }
  #events li:hover { background: var(--bg); }
  #events .t { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 52px; }
  .pill { font-size: 11px; padding: 1px 6px; border-radius: 9px; color: #fff; }
  #error { white-space: pre-wrap; color: var(--brake); font-size: 12px; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; height: auto; }
    #left { grid-template-rows: 55vh 170px auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Drive Sim</h1>
  <select id="route"></select>
  <input id="segs" placeholder="segments, e.g. 5-9" size="14">
  <select id="mode" title="replay: the recording drives, the code reports; closed loop: the simulated car obeys Stop Sign Assist">
    <option value="replay">Replay</option><option value="closed">Closed loop</option>
  </select>
  <label title="closed loop: seconds the driver waits at a stop before tapping the accelerator">wait <input id="wait" type="number" value="2" min="0" step="0.5" style="width:56px">s</label>
  <button id="run" class="primary">Run</button>
  <label><input type="checkbox" id="follow" checked> follow car</label>
  <span id="status">loading routes…</span>
</header>
<main>
  <div id="left">
    <div id="map"></div>
    <canvas id="chart"></canvas>
    <div id="controls">
      <button id="play">Play</button>
      <select id="speed"><option>1</option><option selected>4</option><option>10</option><option>30</option></select>
      <input type="range" id="scrub" min="0" max="0" value="0">
      <span id="now"></span>
    </div>
  </div>
  <aside>
    <div class="legend">
      <span><i class="sw" style="background:var(--idle)"></i>idle</span>
      <span><i class="sw" style="background:var(--coast)"></i>coasting</span>
      <span><i class="sw" style="background:var(--brake)"></i>braking</span>
      <span><i class="sw" style="background:var(--stopped)"></i>stopped</span>
      <span><i class="sw" style="background:var(--turn)"></i>turn desire</span>
    </div>
    <div class="legend" style="margin-top:6px">
      <span><i class="sw" style="background:var(--applies)"></i>sign applies</span>
      <span><i class="sw" style="background:var(--notours)"></i>not ours</span>
      <span><i class="sw" style="background:var(--unknown)"></i>unknown</span>
    </div>
    <h2>At cursor</h2>
    <div class="kv" id="at"></div>
    <h2>Summary</h2>
    <div class="kv" id="summary"></div>
    <div id="error"></div>
    <h2>Events</h2>
    <ul id="events"></ul>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const STATE_COLOR = { idle: '--idle', coasting: '--coast', braking: '--brake', stopped: '--stopped', disabled: '--idle' };
const VERDICT_COLOR = { applies: '--applies', not_ours: '--notours', unknown: '--unknown' };
const DESIRES = ['none', 'turnLeft', 'turnRight', 'laneChgL', 'laneChgR', 'keepL', 'keepR'];

const map = L.map('map', { preferCanvas: true }).setView([37.5167, -121.9579], 15);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
let layers = L.layerGroup().addTo(map);
let car = null;
let sim = null, idx = 0, playing = false, lastTick = 0;

function lsGet(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

async function loadRoutes() {
  const r = await fetch('/api/routes').then(r => r.json());
  const sel = $('route');
  sel.innerHTML = r.routes.map(x => `<option value="${x.route}">${x.route} (${x.segments} segs)</option>`).join('');
  const saved = lsGet('route', '');
  if (r.routes.some(x => x.route === saved)) sel.value = saved;
  $('segs').value = lsGet('segs', '');
  $('mode').value = lsGet('mode', 'replay');
  $('status').textContent = `${r.routes.length} routes in ${r.root}`;
}

async function run() {
  const route = $('route').value, segs = $('segs').value.trim(), mode = $('mode').value, wait = $('wait').value;
  lsSet('route', route); lsSet('segs', segs); lsSet('mode', mode);
  $('status').textContent = 'running current code…'; $('error').textContent = '';
  const res = await fetch(`/api/sim?route=${encodeURIComponent(route)}&segs=${encodeURIComponent(segs)}&mode=${mode}&wait=${encodeURIComponent(wait)}`);
  const out = await res.json();
  if (!res.ok) { $('status').textContent = 'error'; $('error').textContent = out.error + '\n' + (out.trace || ''); return; }
  sim = out;
  const loop = out.mode === 'closed' ? ` · closed loop: ${out.simulated_s}s vs ${out.recorded_s}s recorded${out.completed ? '' : ' · STOPPED SHORT of the route end'}` : '';
  $('status').textContent = `${out.frames} frames · parse ${out.timing.extract_s}s · sim ${out.timing.simulate_s}s${loop} · ran ${new Date().toLocaleTimeString()}`;
  draw();
}

function draw() {
  layers.clearLayers();
  const c = sim.cols, n = c.t.length;
  // path, split into runs of the same colour (stop-sign state, or turn desire when idle)
  let start = 0;
  const colourAt = i => c.state[i] !== 'idle' ? css(STATE_COLOR[c.state[i]] || '--idle') : (c.turn[i] ? css('--turn') : css('--idle'));
  for (let i = 1; i <= n; i++) {
    if (i === n || colourAt(i) !== colourAt(start)) {
      const pts = [];
      for (let j = start; j <= Math.min(i, n - 1); j += 2) pts.push([c.lat[j], c.lon[j]]);
      if (pts.length > 1) L.polyline(pts, { color: colourAt(start), weight: c.state[start] !== 'idle' ? 6 : 4, opacity: .9 }).addTo(layers);
      start = i;
    }
  }
  for (const s of sim.signs) {
    const col = css(VERDICT_COLOR[s.verdict]);
    L.circleMarker([s.lat, s.lon], { radius: 7, color: '#fff', weight: 2, fillColor: col, fillOpacity: 1 })
      .bindPopup(`<b>stop ${s.id}</b><br>${s.verdict.replace('_', ' ')}<br>direction: ${s.direction ?? '—'}${s.all_way ? ' · all-way' : ''}` +
                 `<br>approaches: ${s.approaches ? s.approaches.map(a => a.toFixed(0) + '°').join(', ') : '—'}` +
                 `<br>car passed at ${s.pass_bearing}°, ${s.pass_dist} m away`).addTo(layers);
    for (const a of s.approaches || []) {   // arrow: the direction of travel the sign holds
      const r = 0.00018, th = a * Math.PI / 180, cosLat = Math.cos(s.lat * Math.PI / 180);
      const from = [s.lat - r * Math.cos(th), s.lon - r * Math.sin(th) / cosLat];
      L.polyline([from, [s.lat, s.lon]], { color: col, weight: 2, dashArray: '3 3' }).addTo(layers);
    }
  }
  car = L.circleMarker([c.lat[0], c.lon[0]], { radius: 8, color: '#fff', weight: 3, fillColor: css('--accent'), fillOpacity: 1 }).addTo(layers);
  map.fitBounds(L.latLngBounds(c.lat.map((la, i) => [la, c.lon[i]])), { padding: [20, 20] });
  $('scrub').max = n - 1;
  const conf = c.confirmed.filter(Boolean).length;
  $('summary').innerHTML = kv({
    'signs near path': sim.signs.length,
    'applies / not ours / unknown': ['applies', 'not_ours', 'unknown'].map(v => sim.signs.filter(s => s.verdict === v).length).join(' / '),
    'braking time': (c.state.filter(s => s === 'braking').length / 20).toFixed(1) + ' s',
    'coasting time': (c.state.filter(s => s === 'coasting').length / 20).toFixed(1) + ' s',
    'too-late confirms': sim.events.filter(e => e.too_late).length,
    'turn desire time': (c.turn.filter(Boolean).length / 20).toFixed(1) + ' s',
    ...(sim.mode === 'closed' ? {
      'mode': 'closed loop', 'route length': (sim.path_m / 1609.34).toFixed(2) + ' mi',
      'time: simulated / recorded': `${sim.simulated_s} / ${sim.recorded_s} s`,
      'assist stops': sim.stops.length ? sim.stops.map(x => `${x.t.toFixed(0)}s @${x.dist} m`).join(', ') : 'none',
    } : { 'mode': 'replay' }),
  });
  $('events').innerHTML = sim.events.filter(e => e.state !== 'idle' || e.turn || e.confirmed).map(e =>
    `<li data-i="${e.i}"><span class="t">${e.t.toFixed(1)}s</span>` +
    `<span class="pill" style="background:${css(e.turn && e.state === 'idle' ? '--turn' : STATE_COLOR[e.state] || '--idle')}">${e.turn && e.state === 'idle' ? 'turn ' + e.turn : e.state}</span>` +
    `<span>${e.sign ? 'sign ' + e.sign + ' · ' + e.dist + ' m' : ''} · ${e.mph} mph${e.confirmed ? ' · confirmed' : ''}${e.too_late ? ' · too late' : ''}</span></li>`).join('');
  seek(0);
}

function kv(obj) { return Object.entries(obj).map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join(''); }

function seek(i) {
  if (!sim) return;
  const c = sim.cols;
  idx = Math.max(0, Math.min(c.t.length - 1, i | 0));
  $('scrub').value = idx;
  car.setLatLng([c.lat[idx], c.lon[idx]]);
  if ($('follow').checked && playing) map.panTo([c.lat[idx], c.lon[idx]], { animate: false });
  $('now').textContent = `${c.t[idx].toFixed(1)} s · ${c.mph[idx]} mph · ${c.state[idx]}`;
  $('at').innerHTML = kv({
    'time': c.t[idx].toFixed(2) + ' s', 'speed': c.mph[idx] + ' mph' + (c.rec_mph ? ` (you: ${c.rec_mph[idx]})` : ''),
    'stop state': c.state[idx], 'sign': c.sign[idx] ?? '—', 'distance': c.dist[idx] != null ? c.dist[idx] + ' m' : '—',
    'target': c.target_mph[idx] != null ? c.target_mph[idx] + ' mph' : '—',
    'model confirm': `${c.filt[idx]}${c.confirmed[idx] ? ' · latched' : ''}${c.too_late[idx] ? ' · too late' : ''}`,
    'blinker': c.blinker[idx] || '—', 'turn desire (sim)': c.turn[idx] || '—', 'desire (logged)': DESIRES[c.logged_desire[idx]] || '—',
    'wheel': c.wheel[idx] + '°' + (c.pressed[idx] ? ' · driver' : ''), 'steering active': c.lat_active[idx] ? 'yes' : 'no',
    'model curvature': c.curv[idx],
  });
  drawChart();
}

function drawChart() {
  const cv = $('chart'), dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  if (!sim) return;
  const c = sim.cols, n = c.t.length, pad = 28;
  const vmax = Math.max(30, ...c.mph);
  const X = i => pad + (w - pad - 8) * i / (n - 1), Y = v => h - 18 - (h - 30) * v / vmax;
  g.font = '11px -apple-system, sans-serif'; g.fillStyle = css('--muted'); g.strokeStyle = css('--line');
  for (let v = 0; v <= vmax; v += 10) { g.beginPath(); g.moveTo(pad, Y(v)); g.lineTo(w - 8, Y(v)); g.stroke(); g.fillText(v, 4, Y(v) + 4); }
  for (let i = 0; i < n; i++) {   // state bands
    if (c.state[i] !== 'idle' || c.turn[i]) {
      g.fillStyle = css(c.state[i] !== 'idle' ? STATE_COLOR[c.state[i]] : '--turn'); g.globalAlpha = .18;
      g.fillRect(X(i), 6, Math.max(1, (w - pad) / n), h - 24); g.globalAlpha = 1;
    }
  }
  const line = (arr, col, width, dash) => {
    g.strokeStyle = col; g.lineWidth = width; g.setLineDash(dash || []); g.beginPath(); let on = false;
    for (let i = 0; i < n; i += 2) { const v = arr[i]; if (v == null) { on = false; continue; } on ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)); on = true; }
    g.stroke(); g.setLineDash([]);
  };
  if (c.rec_mph) line(c.rec_mph, css('--muted'), 1, [2, 2]);
  line(c.mph, css('--ink'), 1.5);
  line(c.target_mph, css('--brake'), 1.5, [4, 3]);
  g.strokeStyle = css('--accent'); g.lineWidth = 1.5; g.beginPath(); g.moveTo(X(idx), 4); g.lineTo(X(idx), h - 16); g.stroke();
  g.fillStyle = css('--muted');
  g.fillText(sim.mode === 'closed' ? 'speed (mph): simulated car; red dashed: assist command; grey dotted: what you drove there'
                                   : 'speed (mph): as driven; red dashed: what Stop Sign Assist would command', pad, h - 4);
}

function tick(ts) {
  if (playing && sim) {
    const dt = (ts - lastTick) / 1000; lastTick = ts;
    const step = Math.max(1, Math.round(dt * 20 * +$('speed').value));
    if (idx >= sim.cols.t.length - 1) { playing = false; $('play').textContent = 'Play'; } else seek(idx + step);
  }
  requestAnimationFrame(tick);
}

$('run').onclick = run;
$('scrub').oninput = e => seek(+e.target.value);
$('play').onclick = () => { playing = !playing; lastTick = performance.now(); $('play').textContent = playing ? 'Pause' : 'Play'; };
$('events').onclick = e => { const li = e.target.closest('li'); if (li) { seek(+li.dataset.i); map.panTo(car.getLatLng()); } };
$('chart').onclick = e => { if (sim) { const r = e.target.getBoundingClientRect(); seek((e.clientX - r.left - 28) / (r.width - 36) * (sim.cols.t.length - 1)); } };
window.onresize = drawChart;
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.key === ' ') { e.preventDefault(); $('play').click(); }
  if (e.key === 'ArrowRight') seek(idx + (e.shiftKey ? 200 : 20));
  if (e.key === 'ArrowLeft') seek(idx - (e.shiftKey ? 200 : 20));
  if (e.key === 'r' && (e.metaKey || e.ctrlKey) === false) run();
});
loadRoutes().catch(e => { $('status').textContent = 'server not reachable'; $('error').textContent = String(e); });
requestAnimationFrame(tick);
</script>
</body>
</html>
